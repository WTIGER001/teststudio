{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "teststudio.name" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "teststudio.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "teststudio.selector" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespace | quote }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.ingressPodLabels | nindent 14 }}
      ports:
        - protocol: TCP
          port: 8040
        - protocol: TCP
          port: 8041
{{- end }}
