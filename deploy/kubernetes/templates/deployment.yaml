apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "teststudio.name" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "teststudio.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 300
  strategy:
    {{- if and (eq .Values.artifactStore.driver "filesystem") (eq .Values.persistence.accessMode "ReadWriteOnce") }}
    type: Recreate
    {{- else }}
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
    {{- end }}
  selector:
    matchLabels:
      {{- include "teststudio.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "teststudio.selector" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum | quote }}
    spec:
      serviceAccountName: {{ include "teststudio.name" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        kubernetes.io/os: linux
        kubernetes.io/arch: {{ .Values.image.architecture }}
      {{- if .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- range .Values.image.pullSecrets }}
        - name: {{ . | quote }}
        {{- end }}
      {{- end }}
      containers:
        - name: api
          image: {{ printf "%s@%s" .Values.image.repository .Values.image.digest | quote }}
          imagePullPolicy: IfNotPresent
          args:
            - {{ printf "--public-url=%s" .Values.origins.ui | quote }}
            - {{ printf "--artifact-origin=%s" .Values.origins.artifacts | quote }}
            - --database-env=TESTSTUDIO_DATABASE
            - --require-postgres=true
            - --oidc-config=/etc/teststudio/providers.json
            {{- if .Values.secretBindings.existingSecret }}
            - --secret-bindings=/etc/teststudio-secrets/bindings.json
            {{- end }}
            - {{ printf "--oidc-secret-refs=%s" (include "teststudio.oidcReferences" .) | quote }}
            {{- if .Values.oidc.caSecret }}
            - --oidc-ca-file=/etc/teststudio-oidc/ca.crt
            {{- end }}
            {{- if .Values.httpTrust.existingSecret }}
            - --http-trust-bundles=/etc/teststudio-http-trust/bindings.json
            {{- end }}
            - {{ printf "--bootstrap-issuer=%s" .Values.bootstrap.issuer | quote }}
            - {{ printf "--bootstrap-subject=%s" .Values.bootstrap.subject | quote }}
            - {{ printf "--local-accounts=%t" .Values.localAccounts | quote }}
            {{- if .Values.recordingCompanion }}
            - --recording-companion=true
            {{- end }}
            - --artifact-store-config=/etc/teststudio/artifact-store.json
            - --execution-location=kubernetes
            {{- if .Values.controller.enabled }}
            - --execution-worker=false
            {{- end }}
            {{- if .Values.workers.enabled }}
            - --worker-addr=0.0.0.0:8042
            - --kubernetes-workers-config=/etc/teststudio/kubernetes-workers.json
            {{- end }}
            {{- if and .Values.preparation.enabled .Values.preparation.acceptNewWork }}
            - --source-bundles=true
            - --prepared-sources=true
            {{- $runners := list }}
            {{- if .Values.preparation.goRuntime }}{{- $runners = append $runners "go" }}{{- end }}
            {{- if .Values.preparation.playwrightRuntime }}{{- $runners = append $runners "playwright" }}{{- end }}
            - {{ printf "--source-bundle-runners=%s" (join "," $runners) | quote }}
            {{- end }}
          env:
            - name: TESTSTUDIO_DATABASE
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret | quote }}
                  key: {{ .Values.database.key | quote }}
            {{- range $name, $reference := .Values.oidc.credentials }}
            - name: {{ $name }}
              valueFrom:
                secretKeyRef:
                  name: {{ $reference.existingSecret | quote }}
                  key: {{ $reference.key | quote }}
            {{- end }}
            {{- if .Values.workers.enabled }}
            {{- range $name, $reference := .Values.workers.registry.credentials }}
            - name: {{ $name }}
              valueFrom:
                secretKeyRef:
                  name: {{ $reference.existingSecret | quote }}
                  key: {{ $reference.key | quote }}
            {{- end }}
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: api
              containerPort: 8040
            - name: artifacts
              containerPort: 8041
            {{- if .Values.workers.enabled }}
            - name: worker
              containerPort: 8042
            {{- end }}
          startupProbe:
            httpGet:
              path: /healthz
              port: api
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /healthz
              port: api
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /livez
              port: api
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- if .Values.secretBindings.existingSecret }}
            - name: secret-bindings
              mountPath: /etc/teststudio-secrets
              readOnly: true
            {{- end }}
            {{- if and .Values.workers.gateway.enabled .Values.workers.gateway.caSecret }}
            - name: gateway-ca
              mountPath: /etc/teststudio-gateway
              readOnly: true
            {{- end }}
            - name: config
              mountPath: /etc/teststudio
              readOnly: true
            - name: data
              mountPath: /data
            - name: temporary
              mountPath: /tmp
            {{- if .Values.oidc.caSecret }}
            - name: oidc-ca
              mountPath: /etc/teststudio-oidc
              readOnly: true
            {{- end }}
            {{- if .Values.httpTrust.existingSecret }}
            - name: http-trust
              mountPath: /etc/teststudio-http-trust
              readOnly: true
            {{- end }}
            {{- if .Values.workers.enabled }}
            - name: controller-identity
              mountPath: /var/run/teststudio-controller
              readOnly: true
            {{- if .Values.workers.registry.caSecret }}
            - name: registry-ca
              mountPath: /etc/teststudio-registry
              readOnly: true
            {{- end }}
            {{- end }}
      volumes:
        {{- if .Values.secretBindings.existingSecret }}
        - name: secret-bindings
          secret:
            secretName: {{ .Values.secretBindings.existingSecret | quote }}
            defaultMode: 0440
        {{- end }}
        {{- if and .Values.workers.gateway.enabled .Values.workers.gateway.caSecret }}
        - name: gateway-ca
          secret:
            secretName: {{ .Values.workers.gateway.caSecret | quote }}
            defaultMode: 0444
            items:
              - key: ca.crt
                path: ca.crt
        {{- end }}
        - name: config
          configMap:
            name: {{ include "teststudio.name" . }}-config
            defaultMode: 0444
        - name: data
          {{- if eq .Values.artifactStore.driver "filesystem" }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (printf "%s-artifacts" (include "teststudio.name" .)) | quote }}
          {{- else }}
          emptyDir:
            sizeLimit: 256Mi
          {{- end }}
        - name: temporary
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        {{- if .Values.oidc.caSecret }}
        - name: oidc-ca
          secret:
            secretName: {{ .Values.oidc.caSecret | quote }}
            defaultMode: 0444
            items:
              - key: ca.crt
                path: ca.crt
        {{- end }}
        {{- if .Values.httpTrust.existingSecret }}
        - name: http-trust
          secret:
            secretName: {{ .Values.httpTrust.existingSecret | quote }}
            defaultMode: 0444
        {{- end }}

        {{- if .Values.workers.enabled }}
        - name: controller-identity
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
        {{- if .Values.workers.registry.caSecret }}
        - name: registry-ca
          secret:
            secretName: {{ .Values.workers.registry.caSecret | quote }}
            defaultMode: 0440
            items:
              - key: ca.crt
                path: ca.crt
        {{- end }}
        {{- end }}
