apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "teststudio.name" . }}
  namespace: {{ .Release.Namespace | quote }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "teststudio.labels" . | nindent 4 }}
automountServiceAccountToken: false
