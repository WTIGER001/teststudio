{{- include "teststudio.validate" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "teststudio.name" . }}-config
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "teststudio.labels" . | nindent 4 }}
data:
  providers.json: |-
    {{- .Values.oidc.providers | toPrettyJson | nindent 4 }}
  artifact-store.json: |-
    {{- include "teststudio.artifactConfiguration" . | nindent 4 }}

  {{- if .Values.workers.enabled }}
  kubernetes-workers.json: |-
    {{- include "teststudio.workerConfiguration" . | nindent 4 }}
  {{- end }}
