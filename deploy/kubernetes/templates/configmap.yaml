{{- include "teststudio.validate" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "teststudio.name" . }}-config
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "teststudio.labels" . | nindent 4 }}
data:
  providers.json: |-
    {{- .Values.oidc.providers | toPrettyJson | nindent 4 }}
  artifact-store.json: |-
    {{- if eq .Values.artifactStore.driver "filesystem" }}
    {{- dict "driver" "filesystem" "directory" "/data/artifacts" | toPrettyJson | nindent 4 }}
    {{- else }}
    {{- .Values.artifactStore | toPrettyJson | nindent 4 }}
    {{- end }}
