AWSTemplateFormatVersion: '2010-09-09'
Description: Independent TestStudio core service on ECS Fargate with separate CloudFront UI and evidence origins
Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  PublicSubnets:
    Type: List<AWS::EC2::Subnet::Id>
  PrivateSubnets:
    Type: List<AWS::EC2::Subnet::Id>
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
  UiHostname:
    Type: String
    AllowedPattern: '^[a-z0-9](?:[a-z0-9.-]*[a-z0-9])?\.[a-z]{2,63}$'
  ArtifactHostname:
    Type: String
    AllowedPattern: '^[a-z0-9](?:[a-z0-9.-]*[a-z0-9])?\.[a-z]{2,63}$'
  OriginHostname:
    Type: String
    AllowedPattern: '^[a-z0-9](?:[a-z0-9.-]*[a-z0-9])?\.[a-z]{2,63}$'
  ViewerCertificateArn:
    Type: String
    AllowedPattern: '^arn:aws:acm:us-east-1:[0-9]{12}:certificate/[a-f0-9-]+$'
  OriginCertificateArn:
    Type: String
    AllowedPattern: '^arn:aws:acm:[a-z0-9-]+:[0-9]{12}:certificate/[a-f0-9-]+$'
  CloudFrontPrefixListId:
    Type: String
    AllowedPattern: '^pl-[a-f0-9]+$'
  ServiceRepositoryName:
    Type: String
    AllowedPattern: '^[a-z0-9]+(?:[._/-][a-z0-9]+)*$'
    MaxLength: 256
  ServiceImageDigest:
    Type: String
    AllowedPattern: '^sha256:[a-f0-9]{64}$'
  Architecture:
    Type: String
    Default: ARM64
    AllowedValues: [ARM64, X86_64]
  DatabaseSecretArn:
    Type: String
    AllowedPattern: '^arn:aws:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:[A-Za-z0-9/_+=.@-]+$'
  OidcConfigurationSecretArn:
    Type: String
    AllowedPattern: '^arn:aws:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:[A-Za-z0-9/_+=.@-]+$'
  OidcClientOneSecretArn:
    Type: String
    Default: ''
    AllowedPattern: '^$|^arn:aws:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:[A-Za-z0-9/_+=.@-]+$'
  OidcClientTwoSecretArn:
    Type: String
    Default: ''
    AllowedPattern: '^$|^arn:aws:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:[A-Za-z0-9/_+=.@-]+$'
  SecretKmsKeyArn:
    Type: String
    Default: ''
    AllowedPattern: '^$|^arn:aws:kms:[a-z0-9-]+:[0-9]{12}:key/[a-f0-9-]+$'
  BootstrapIssuer:
    Type: String
    AllowedPattern: '^https://[^?# @]+$'
  BootstrapSubject:
    Type: String
    MinLength: 1
    MaxLength: 512
  LocalAccounts:
    Type: String
    Default: 'false'
    AllowedValues: ['false', 'true']
  DesiredCount:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 10
Rules:
  SeparateOrigins:
    Assertions:
      - Assert: !Not [!Equals [!Ref UiHostname, !Ref ArtifactHostname]]
        AssertDescription: UI and evidence require separate hosts
      - Assert: !Not [!Equals [!Ref UiHostname, !Ref OriginHostname]]
        AssertDescription: The load balancer origin requires a separate host
      - Assert: !Not [!Equals [!Ref ArtifactHostname, !Ref OriginHostname]]
        AssertDescription: The load balancer origin requires a separate host
Conditions:
  ClientOne: !Not [!Equals [!Ref OidcClientOneSecretArn, '']]
  ClientTwo: !Not [!Equals [!Ref OidcClientTwoSecretArn, '']]
  SecretKms: !Not [!Equals [!Ref SecretKmsKeyArn, '']]
Resources:
  UiBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      OwnershipControls:
        Rules: [{ObjectOwnership: BucketOwnerEnforced}]
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
  EvidenceBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      OwnershipControls:
        Rules: [{ObjectOwnership: BucketOwnerEnforced}]
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
  EvidencePolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref EvidenceBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource: [!GetAtt EvidenceBucket.Arn, !Sub '${EvidenceBucket.Arn}/*']
            Condition:
              Bool: {aws:SecureTransport: 'false'}
  OriginToken:
    Type: AWS::SecretsManager::Secret
    Properties:
      GenerateSecretString:
        PasswordLength: 48
        ExcludePunctuation: true
  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: CloudFront HTTPS to the private application origin
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourcePrefixListId: !Ref CloudFrontPrefixListId
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 8040
          ToPort: 8041
          DestinationSecurityGroupId: !Ref TaskSecurityGroup
  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: TestStudio core service outbound access
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 0.0.0.0/0
  TaskIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref TaskSecurityGroup
      IpProtocol: tcp
      FromPort: 8040
      ToPort: 8041
      SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Type: application
      Scheme: internet-facing
      Subnets: !Ref PublicSubnets
      SecurityGroups: [!Ref LoadBalancerSecurityGroup]
      LoadBalancerAttributes:
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: 'true'
        - Key: idle_timeout.timeout_seconds
          Value: '120'
  ApiTarget:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      TargetType: ip
      Protocol: HTTP
      Port: 8040
      HealthCheckPath: /healthz
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher: {HttpCode: '200'}
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '30'
  ArtifactTarget:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      TargetType: ip
      Protocol: HTTP
      Port: 8041
      HealthCheckPort: '8040'
      HealthCheckPath: /healthz
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher: {HttpCode: '200'}
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '30'
  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates: [{CertificateArn: !Ref OriginCertificateArn}]
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig: {StatusCode: '403', ContentType: text/plain, MessageBody: Origin access denied}
  ApiRoute:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref Listener
      Priority: 1
      Conditions:
        - Field: http-header
          HttpHeaderConfig:
            HttpHeaderName: X-TestStudio-Origin-Token
            Values: [!Sub '{{resolve:secretsmanager:${OriginToken}:SecretString}}']
        - Field: http-header
          HttpHeaderConfig:
            HttpHeaderName: X-TestStudio-Service
            Values: [api]
      Actions: [{Type: forward, TargetGroupArn: !Ref ApiTarget}]
  ArtifactRoute:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref Listener
      Priority: 2
      Conditions:
        - Field: http-header
          HttpHeaderConfig:
            HttpHeaderName: X-TestStudio-Origin-Token
            Values: [!Sub '{{resolve:secretsmanager:${OriginToken}:SecretString}}']
        - Field: http-header
          HttpHeaderConfig:
            HttpHeaderName: X-TestStudio-Service
            Values: [artifacts]
      Actions: [{Type: forward, TargetGroupArn: !Ref ArtifactTarget}]
  OriginRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref OriginHostname
      Type: A
      AliasTarget:
        DNSName: !GetAtt LoadBalancer.DNSName
        HostedZoneId: !GetAtt LoadBalancer.CanonicalHostedZoneID
        EvaluateTargetHealth: false
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterSettings: [{Name: containerInsights, Value: enabled}]
  ServiceLog:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RetentionInDays: 30
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref 'AWS::AccountId'
              ArnLike:
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:*'
      Policies:
        - PolicyName: service-startup
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action: [ecr:BatchCheckLayerAvailability, ecr:GetDownloadUrlForLayer, ecr:BatchGetImage]
                Resource: !Sub 'arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/${ServiceRepositoryName}'
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt ServiceLog.Arn
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Ref DatabaseSecretArn
                  - !Ref OidcConfigurationSecretArn
                  - !If [ClientOne, !Ref OidcClientOneSecretArn, !Ref 'AWS::NoValue']
                  - !If [ClientTwo, !Ref OidcClientTwoSecretArn, !Ref 'AWS::NoValue']
              - !If
                - SecretKms
                - Effect: Allow
                  Action: kms:Decrypt
                  Resource: !Ref SecretKmsKeyArn
                  Condition:
                    StringEquals:
                      kms:ViaService: !Sub 'secretsmanager.${AWS::Region}.${AWS::URLSuffix}'
                - !Ref 'AWS::NoValue'
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref 'AWS::AccountId'
              ArnLike:
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:*'
      Policies:
        - PolicyName: private-evidence
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt EvidenceBucket.Arn
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource: !Sub '${EvidenceBucket.Arn}/teststudio/*'
  Task:
    Type: AWS::ECS::TaskDefinition
    Properties:
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '512'
      Memory: '1024'
      RuntimePlatform:
        CpuArchitecture: !Ref Architecture
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      Volumes: [{Name: temporary}]
      ContainerDefinitions:
        - Name: service
          Image: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.${AWS::URLSuffix}/${ServiceRepositoryName}@${ServiceImageDigest}'
          Essential: true
          User: '65532:65532'
          ReadonlyRootFilesystem: true
          LinuxParameters:
            Capabilities: {Drop: [ALL]}
          MountPoints: [{SourceVolume: temporary, ContainerPath: /tmp, ReadOnly: false}]
          StopTimeout: 90
          PortMappings:
            - {ContainerPort: 8040, Protocol: tcp, Name: api}
            - {ContainerPort: 8041, Protocol: tcp, Name: artifacts}
          Command:
            - !Sub '--public-url=https://${UiHostname}'
            - !Sub '--artifact-origin=https://${ArtifactHostname}'
            - --require-postgres=true
            - --oidc-config-env=TESTSTUDIO_OIDC_CONFIGURATION
            - --artifact-store-env=TESTSTUDIO_ARTIFACT_CONFIGURATION
            - --execution-location=aws-ecs
            - !Sub '--local-accounts=${LocalAccounts}'
            - !Sub '--bootstrap-issuer=${BootstrapIssuer}'
            - !Sub '--bootstrap-subject=${BootstrapSubject}'
            - !Join
              - ''
              - - --oidc-secret-refs=
                - !If [ClientOne, 'env:TESTSTUDIO_OIDC_CLIENT_ONE', '']
                - !If [ClientTwo, ',env:TESTSTUDIO_OIDC_CLIENT_TWO', '']
          Environment:
            - Name: TESTSTUDIO_ARTIFACT_CONFIGURATION
              Value: !Sub '{"driver":"s3","s3":{"region":"${AWS::Region}","bucket":"${EvidenceBucket}","prefix":"teststudio","expectedOwner":"${AWS::AccountId}"}}'
          Secrets:
            - {Name: TESTSTUDIO_DATABASE, ValueFrom: !Ref DatabaseSecretArn}
            - {Name: TESTSTUDIO_OIDC_CONFIGURATION, ValueFrom: !Ref OidcConfigurationSecretArn}
            - !If
              - ClientOne
              - {Name: TESTSTUDIO_OIDC_CLIENT_ONE, ValueFrom: !Ref OidcClientOneSecretArn}
              - !Ref 'AWS::NoValue'
            - !If
              - ClientTwo
              - {Name: TESTSTUDIO_OIDC_CLIENT_TWO, ValueFrom: !Ref OidcClientTwoSecretArn}
              - !Ref 'AWS::NoValue'
          HealthCheck:
            Command: [CMD, /app/teststudio-health, --url=http://127.0.0.1:8040/livez]
            Interval: 30
            Timeout: 3
            Retries: 3
            StartPeriod: 30
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ServiceLog
              awslogs-region: !Ref 'AWS::Region'
              awslogs-stream-prefix: service
              mode: non-blocking
              max-buffer-size: 4m
  Service:
    Type: AWS::ECS::Service
    DependsOn: [ApiRoute, ArtifactRoute, EvidencePolicy]
    Properties:
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      PlatformVersion: '1.4.0'
      TaskDefinition: !Ref Task
      DesiredCount: !Ref DesiredCount
      EnableExecuteCommand: false
      DeploymentConfiguration:
        DeploymentCircuitBreaker: {Enable: true, Rollback: true}
        MaximumPercent: 200
        MinimumHealthyPercent: 100
      HealthCheckGracePeriodSeconds: 90
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets: !Ref PrivateSubnets
          SecurityGroups: [!Ref TaskSecurityGroup]
      LoadBalancers:
        - {ContainerName: service, ContainerPort: 8040, TargetGroupArn: !Ref ApiTarget}
        - {ContainerName: service, ContainerPort: 8041, TargetGroupArn: !Ref ArtifactTarget}
  UiOriginAccess:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-ui'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4
  NoCache:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub '${AWS::StackName}-private-no-cache'
        MinTTL: 0
        DefaultTTL: 0
        MaxTTL: 0
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: false
          CookiesConfig: {CookieBehavior: none}
          HeadersConfig: {HeaderBehavior: none}
          QueryStringsConfig: {QueryStringBehavior: none}
  ForwardRequest:
    Type: AWS::CloudFront::OriginRequestPolicy
    Properties:
      OriginRequestPolicyConfig:
        Name: !Sub '${AWS::StackName}-private-request'
        CookiesConfig: {CookieBehavior: all}
        HeadersConfig: {HeaderBehavior: allExcept, Headers: [host]}
        QueryStringsConfig: {QueryStringBehavior: all}
  UiCache:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub '${AWS::StackName}-ui'
        MinTTL: 0
        DefaultTTL: 60
        MaxTTL: 600
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          CookiesConfig: {CookieBehavior: none}
          HeadersConfig: {HeaderBehavior: none}
          QueryStringsConfig: {QueryStringBehavior: none}
  UiHeaders:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub '${AWS::StackName}-ui'
        SecurityHeadersConfig:
          ContentTypeOptions: {Override: true}
          FrameOptions: {FrameOption: DENY, Override: true}
          ReferrerPolicy: {ReferrerPolicy: strict-origin-when-cross-origin, Override: true}
          StrictTransportSecurity: {AccessControlMaxAgeSec: 31536000, Override: true}
          ContentSecurityPolicy:
            Override: true
            ContentSecurityPolicy: !Sub "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://${ArtifactHostname}; media-src 'self' https://${ArtifactHostname}; connect-src 'self' https://${ArtifactHostname}; frame-src https://${ArtifactHostname}; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"
  UiRoutes:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${AWS::StackName}-ui-routes'
      AutoPublish: true
      FunctionConfig: {Comment: UI route fallback only, Runtime: cloudfront-js-2.0}
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var segment = request.uri.substring(request.uri.lastIndexOf('/') + 1);
          if (segment.indexOf('.') < 0) request.uri = '/index.html';
          return request;
        }
  UiDistribution:
    Type: AWS::CloudFront::Distribution
    DependsOn: OriginRecord
    Properties:
      DistributionConfig:
        Enabled: true
        CustomErrorResponses:
          - {ErrorCode: 400, ErrorCachingMinTTL: 0}
          - {ErrorCode: 403, ErrorCachingMinTTL: 0}
          - {ErrorCode: 404, ErrorCachingMinTTL: 0}
          - {ErrorCode: 405, ErrorCachingMinTTL: 0}
          - {ErrorCode: 414, ErrorCachingMinTTL: 0}
          - {ErrorCode: 416, ErrorCachingMinTTL: 0}
          - {ErrorCode: 500, ErrorCachingMinTTL: 0}
          - {ErrorCode: 501, ErrorCachingMinTTL: 0}
          - {ErrorCode: 502, ErrorCachingMinTTL: 0}
          - {ErrorCode: 503, ErrorCachingMinTTL: 0}
          - {ErrorCode: 504, ErrorCachingMinTTL: 0}
        Aliases: [!Ref UiHostname]
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        ViewerCertificate:
          AcmCertificateArn: !Ref ViewerCertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: ui
            DomainName: !GetAtt UiBucket.RegionalDomainName
            S3OriginConfig: {OriginAccessIdentity: ''}
            OriginAccessControlId: !GetAtt UiOriginAccess.Id
          - Id: api
            DomainName: !Ref OriginHostname
            CustomOriginConfig: {OriginProtocolPolicy: https-only, OriginSSLProtocols: [TLSv1.2], OriginReadTimeout: 60}
            OriginCustomHeaders:
              - {HeaderName: X-TestStudio-Service, HeaderValue: api}
              - {HeaderName: X-TestStudio-Origin-Token, HeaderValue: !Sub '{{resolve:secretsmanager:${OriginToken}:SecretString}}'}
        DefaultCacheBehavior:
          TargetOriginId: ui
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          CachePolicyId: !Ref UiCache
          Compress: true
          ResponseHeadersPolicyId: !Ref UiHeaders
          FunctionAssociations:
            - {EventType: viewer-request, FunctionARN: !GetAtt UiRoutes.FunctionARN}
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD]
            CachePolicyId: !Ref NoCache
            OriginRequestPolicyId: !Ref ForwardRequest
            Compress: true
          - PathPattern: /api
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD]
            CachePolicyId: !Ref NoCache
            OriginRequestPolicyId: !Ref ForwardRequest
            Compress: true
          - PathPattern: /auth/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD]
            CachePolicyId: !Ref NoCache
            OriginRequestPolicyId: !Ref ForwardRequest
            Compress: true
          - PathPattern: /auth
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD]
            CachePolicyId: !Ref NoCache
            OriginRequestPolicyId: !Ref ForwardRequest
            Compress: true
          - PathPattern: /healthz
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD]
            CachePolicyId: !Ref NoCache
            OriginRequestPolicyId: !Ref ForwardRequest
            Compress: true
          - PathPattern: /livez
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD]
            CachePolicyId: !Ref NoCache
            OriginRequestPolicyId: !Ref ForwardRequest
            Compress: true
  ArtifactDistribution:
    Type: AWS::CloudFront::Distribution
    DependsOn: OriginRecord
    Properties:
      DistributionConfig:
        Enabled: true
        CustomErrorResponses:
          - {ErrorCode: 400, ErrorCachingMinTTL: 0}
          - {ErrorCode: 403, ErrorCachingMinTTL: 0}
          - {ErrorCode: 404, ErrorCachingMinTTL: 0}
          - {ErrorCode: 405, ErrorCachingMinTTL: 0}
          - {ErrorCode: 414, ErrorCachingMinTTL: 0}
          - {ErrorCode: 416, ErrorCachingMinTTL: 0}
          - {ErrorCode: 500, ErrorCachingMinTTL: 0}
          - {ErrorCode: 501, ErrorCachingMinTTL: 0}
          - {ErrorCode: 502, ErrorCachingMinTTL: 0}
          - {ErrorCode: 503, ErrorCachingMinTTL: 0}
          - {ErrorCode: 504, ErrorCachingMinTTL: 0}
        Aliases: [!Ref ArtifactHostname]
        HttpVersion: http2and3
        IPV6Enabled: true
        ViewerCertificate:
          AcmCertificateArn: !Ref ViewerCertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: artifacts
            DomainName: !Ref OriginHostname
            CustomOriginConfig: {OriginProtocolPolicy: https-only, OriginSSLProtocols: [TLSv1.2], OriginReadTimeout: 60}
            OriginCustomHeaders:
              - {HeaderName: X-TestStudio-Service, HeaderValue: artifacts}
              - {HeaderName: X-TestStudio-Origin-Token, HeaderValue: !Sub '{{resolve:secretsmanager:${OriginToken}:SecretString}}'}
        DefaultCacheBehavior:
          TargetOriginId: artifacts
          ViewerProtocolPolicy: https-only
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          CachePolicyId: !Ref NoCache
          OriginRequestPolicyId: !Ref ForwardRequest
          Compress: false
  UiPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref UiBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: cloudfront.amazonaws.com}
            Action: s3:GetObject
            Resource: !Sub '${UiBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${UiDistribution}'
          - Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource: [!GetAtt UiBucket.Arn, !Sub '${UiBucket.Arn}/*']
            Condition:
              Bool: {aws:SecureTransport: 'false'}
  UiRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref UiHostname
      Type: A
      AliasTarget: {DNSName: !GetAtt UiDistribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2, EvaluateTargetHealth: false}
  ArtifactRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref ArtifactHostname
      Type: A
      AliasTarget: {DNSName: !GetAtt ArtifactDistribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2, EvaluateTargetHealth: false}
Outputs:
  UiUrl:
    Value: !Sub 'https://${UiHostname}'
  ArtifactUrl:
    Value: !Sub 'https://${ArtifactHostname}'
  UiBucketName:
    Value: !Ref UiBucket
  EvidenceBucketName:
    Value: !Ref EvidenceBucket
  UiDistributionId:
    Value: !Ref UiDistribution
  TaskSecurityGroupId:
    Value: !Ref TaskSecurityGroup
  ClusterName:
    Value: !Ref Cluster
  ServiceName:
    Value: !GetAtt Service.Name
