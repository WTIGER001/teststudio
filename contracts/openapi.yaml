"components":
  "securitySchemes":
    "RecordingDevice": {"type":"http","scheme":"bearer","description":"Random session-scoped desktop device token. Does not authorize ordinary application routes."}
    "SessionCookie":
      "type": "apiKey"
      "in": "cookie"
      "name": "teststudio_session"
    "CSRFToken":
      "type": "apiKey"
      "in": "header"
      "name": "X-CSRF-Token"
  "parameters":
    "Grant":
      "name": "grant"
      "in": "path"
      "required": true
      "schema":
        "type": "string"
        "pattern": "^[a-f0-9]{64}$"
      "description": "Stable managed grant identity. Removal and recreation retain revision history."
    "User":
      "name": "user"
      "in": "path"
      "required": true
      "schema":
        "type": "string"
        "pattern": "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"
    "Group":
      "name": "group"
      "in": "path"
      "required": true
      "schema":
        "type": "string"
        "pattern": "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"
    "Session":
      "name": "session"
      "in": "path"
      "required": true
      "schema":
        "type": "string"
        "pattern": "^[a-f0-9]{64}$"
    "Limit":
      "name": "limit"
      "in": "query"
      "schema":
        "type": "integer"
        "minimum": 1
        "maximum": 1000
        "default": 30
    "Cursor":
      "name": "cursor"
      "in": "query"
      "schema":
        "type": "string"
    "Project":
      "name": "project"
      "in": "query"
      "schema":
        "type": "string"
      "description": "Exact group ownership scope. Empty means installation groups, not all projects."
    "Archived":
      "name": "archived"
      "in": "query"
      "schema":
        "type": "boolean"
        "default": false
    "Revision":
      "name": "If-Match"
      "in": "header"
      "required": true
      "schema":
        "type": "string"
        "pattern": "^\"?[1-9][0-9]*\"?$"
      "description": "Current positive record revision, optionally quoted."
    "MembershipRevision":
      "name": "If-Match"
      "in": "header"
      "required": true
      "schema":
        "type": "string"
        "pattern": "^\"?[0-9]+\"?$"
      "description": "Use zero to add a local membership. Use its current positive revision to update it."
    "Origin":
      "name": "Origin"
      "in": "header"
      "required": true
      "schema":
        "type": "string"
        "format": "uri"
      "description": "Configured application origin."
    "RoleProject":
      "name": "project"
      "in": "query"
      "description": "Exact project scope. Empty means installation roles."
      "schema":
        "type": "string"
    "AssignmentProject":
      "name": "project"
      "in": "path"
      "required": true
      "schema":
        "type": "string"
        "pattern": "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"
    "PrincipalKind":
      "name": "kind"
      "in": "path"
      "required": true
      "schema":
        "type": "string"
        "enum":
          - "user"
          - "group"
    "AssignmentPrincipal":
      "name": "principal"
      "in": "path"
      "required": true
      "schema":
        "type": "string"
        "pattern": "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"
    "AssignmentRole":
      "name": "role"
      "in": "path"
      "required": true
      "schema":
        "type": "string"
    "CredentialRevision":
      "name": "If-Match"
      "in": "header"
      "required": true
      "schema":
        "type": "string"
        "pattern": "^\"?[0-9]+\"?$"
      "description": "Use zero to provision local credentials. Use the current positive revision to reset a password."
  "responses":
    "Problem":
      "description": "401 requires sign-in; 403 denies access; 404 hides missing or mismatched resources; 409 requires a fresh revision; 422 rejects invalid requests or administrator lockout."
