      "type": "object"
      "properties":
        "id":
          "type": "string"
          "pattern": "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"
        "name":
          "type": "string"
          "minLength": 1
          "maxLength": 200
        "issuer":
          "type": "string"
          "maxLength": 2048
          "description": "Exact HTTPS issuer, or loopback HTTP for local providers."
        "clientId":
          "type": "string"
          "minLength": 1
          "maxLength": 512
        "secretRef":
          "type": "string"
          "description": "Operator-approved env:VARIABLE reference. Credential values are never accepted or returned."
        "scopes":
          "type": "array"
          "maxItems": 32
          "uniqueItems": true
          "items":
            "type": "string"
            "maxLength": 256
        "disabled":
