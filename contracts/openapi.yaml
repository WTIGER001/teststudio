          "type": "string"
          "maxLength": 256
        "groupMappings":
          "$ref": "#/components/schemas/ProviderMappings"
        "logoutEndpoint":
          "type": "string"
          "description": "Optional exact discovered end-session endpoint. Empty disables provider logout. Uses client_id and a registered post-logout callback without provider tokens in the browser."
        "membershipTtlSeconds":
          "type": "integer"
          "minimum": 0
          "maximum": 3600
          "description": "Zero uses 1800 seconds. Validated group membership expires no later than the token."
        "reason":
          "type": "string"
          "minLength": 1
          "maxLength": 1024
