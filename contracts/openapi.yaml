                "$ref": "#/components/schemas/AssignmentRecord"
        "401":
          "$ref": "#/components/responses/Problem"
        "403":
          "$ref": "#/components/responses/Problem"
        "404":
          "$ref": "#/components/responses/Problem"
        "409":
          "$ref": "#/components/responses/Problem"
        "422":
          "$ref": "#/components/responses/Problem"
    "delete":
      "operationId": "revokeProjectAssignment"
      "summary": "Remove this exact role and binding combination using the current revision and a reason. Preserve the last usable installation administrator."
      "parameters":
        -
          "$ref": "#/components/parameters/AssignmentProject"
        -
          "$ref": "#/components/parameters/PrincipalKind"
        -
          "$ref": "#/components/parameters/AssignmentPrincipal"
        -
          "$ref": "#/components/parameters/AssignmentRole"
        -
          "$ref": "#/components/parameters/Origin"
        -
