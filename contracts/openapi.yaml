          "CSRFToken": []
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/Reason"
"components":
  "securitySchemes":
    "SessionCookie":
      "type": "apiKey"
      "in": "cookie"
      "name": "teststudio_session"
    "CSRFToken":
      "type": "apiKey"
      "in": "header"
      "name": "X-CSRF-Token"
  "parameters":
    "User":
      "name": "user"
      "in": "path"
      "required": true
      "schema":
        "type": "string"
        "pattern": "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"
    "Group":
      "name": "group"
      "in": "path"
      "required": true
      "schema":
        "type": "string"
        "pattern": "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"
    "Session":
      "name": "session"
      "in": "path"
      "required": true
      "schema":
        "type": "string"
        "pattern": "^[a-f0-9]{64}$"
    "Limit":
      "name": "limit"
      "in": "query"
      "schema":
        "type": "integer"
        "minimum": 1
        "maximum": 1000
        "default": 30
    "Cursor":
      "name": "cursor"
      "in": "query"
      "schema":
        "type": "string"
    "Project":
      "name": "project"
      "in": "query"
      "schema":
        "type": "string"
      "description": "Exact group ownership scope. Empty means installation groups, not all projects."
    "Archived":
      "name": "archived"
      "in": "query"
      "schema":
        "type": "boolean"
        "default": false
    "Revision":
      "name": "If-Match"
      "in": "header"
      "required": true
      "schema":
        "type": "string"
        "pattern": "^\"?[1-9][0-9]*\"?$"
      "description": "Current positive record revision, optionally quoted."
    "MembershipRevision":
      "name": "If-Match"
      "in": "header"
      "required": true
      "schema":
        "type": "string"
        "pattern": "^\"?[0-9]+\"?$"
      "description": "Use zero to add a local membership. Use its current positive revision to update it."
    "Origin":
      "name": "Origin"
      "in": "header"
      "required": true
      "schema":
        "type": "string"
        "format": "uri"
      "description": "Configured application origin."
    "RoleProject":
      "name": "project"
      "in": "query"
      "description": "Exact project scope. Empty means installation roles."
      "schema":
        "type": "string"
    "AssignmentProject":
      "name": "project"
      "in": "path"
      "required": true
      "schema":
        "type": "string"
        "pattern": "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"
    "PrincipalKind":
      "name": "kind"
      "in": "path"
      "required": true
      "schema":
        "type": "string"
        "enum":
          - "user"
          - "group"
    "AssignmentPrincipal":
      "name": "principal"
      "in": "path"
      "required": true
      "schema":
        "type": "string"
        "pattern": "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"
    "AssignmentRole":
      "name": "role"
      "in": "path"
      "required": true
      "schema":
        "type": "string"
  "responses":
    "Problem":
      "description": "401 requires sign-in; 403 denies access; 404 hides missing or mismatched resources; 409 requires a fresh revision; 422 rejects invalid requests or administrator lockout."
      "content":
        "application/json":
          "schema":
            "$ref": "#/components/schemas/Problem"
  "schemas":
    "UserDefinition":
      "type": "object"
      "properties":
        "id":
          "type": "string"
          "pattern": "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"
        "name":
          "type": "string"
          "minLength": 1
          "maxLength": 256
          "description": "Nonblank name, limited to 256 UTF-8 bytes."
        "email":
          "type": "string"
          "maxLength": 254
          "description": "One email address, or empty. A profile edit never verifies an email or links an external identity."
      "required":
        - "id"
        - "name"
      "additionalProperties": false
    "User":
      "type": "object"
      "properties":
        "id":
          "type": "string"
          "pattern": "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"
        "name":
          "type": "string"
          "minLength": 1
          "maxLength": 256
          "description": "Nonblank name, limited to 256 UTF-8 bytes."
        "email":
          "type": "string"
          "maxLength": 254
          "description": "One email address, or empty. A profile edit never verifies an email or links an external identity."
        "disabled":
          "type": "boolean"
        "emailVerified":
          "type": "boolean"
        "createdAt":
          "type": "string"
          "format": "date-time"
        "lastSignIn":
          "type": "string"
          "format": "date-time"
        "sessionEpoch":
          "type": "integer"
          "minimum": 0
          "readOnly": true
      "required":
        - "id"
        - "name"
        - "disabled"
        - "emailVerified"
        - "createdAt"
        - "sessionEpoch"
    "GroupDefinition":
      "type": "object"
      "properties":
        "id":
          "type": "string"
          "pattern": "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"
        "name":
          "type": "string"
          "minLength": 1
          "maxLength": 256
        "description":
          "type": "string"
          "maxLength": 4096
        "projectId":
          "type": "string"
          "description": "Permanent ownership scope. Empty or omitted means installation ownership."
      "required":
        - "id"
        - "name"
      "additionalProperties": false
    "Group":
      "type": "object"
      "properties":
        "id":
          "type": "string"
          "pattern": "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"
        "name":
          "type": "string"
          "minLength": 1
          "maxLength": 256
        "description":
          "type": "string"
          "maxLength": 4096
        "projectId":
          "type": "string"
          "description": "Permanent ownership scope. Empty or omitted means installation ownership."
        "archived":
          "type": "boolean"
        "managedBy":
          "type": "string"
          "readOnly": true
          "description": "External membership source. Local editors cannot change this value."
      "required":
        - "id"
        - "name"
        - "description"
        - "archived"
    "Reason":
      "type": "object"
      "properties":
        "reason":
          "type": "string"
          "minLength": 1
          "maxLength": 1024
          "description": "Nonblank reason, limited to 1024 UTF-8 bytes. Saved in the audit record."
      "required":
        - "reason"
      "additionalProperties": false
    "MembershipDefinition":
      "type": "object"
      "properties":
        "expiresAt":
          "type":
            - "string"
            - "null"
          "format": "date-time"
          "description": "Future expiry. Omit or use null for no expiry."
      "additionalProperties": false
    "Membership":
      "type": "object"
      "properties":
        "userId":
          "type": "string"
          "pattern": "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"
        "groupId":
          "type": "string"
          "pattern": "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"
        "source":
          "type": "string"
        "expiresAt":
          "type":
            - "string"
            - "null"
          "format": "date-time"
        "name":
          "type": "string"
        "active":
          "type": "boolean"
        "readOnly":
          "type": "boolean"
        "groupName":
          "type": "string"
        "projectId":
          "type": "string"
      "required":
        - "userId"
        - "groupId"
        - "source"
        - "name"
        - "active"
        - "readOnly"
    "ExternalIdentity":
      "type": "object"
      "properties":
        "issuer":
          "type": "string"
        "subject":
          "type": "string"
