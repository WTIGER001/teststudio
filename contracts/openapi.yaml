"openapi": "3.1.0"
"info":
  "title": "TestStudio API"
  "version": "0.40.0"
  "description": "Implemented user, group, membership, current-profile, and session administration. Includes cumulative Reader, Member, Developer, Contributor, and Owner roles at Project and Application scope, System Admin naming, atomic standard-role replacement, usable-Owner safeguards, scoped capability and explanation queries, and reviewed role conversions with rollback previews. Includes scoped predefined role assignments and managed local password authentication. Includes scoped custom role policies, inheritance, and custom assignments. Includes scoped direct user and group allow and deny grants, expiry updates, and revision-controlled removal. Includes guarded installation-wide predefined role disabling and restoration. Includes permission explanations with read-only engine checks, bounded source scans, and source privacy. Includes managed OIDC provider configuration, operator-approved credential references, and provider-owned group creation. Includes session-bound identity linking with fresh source authentication, fresh target proof, explicit confirmation, and session rotation. Includes project-owned pending access with verified provider email, current approval checks, cancellation, and audited role activation. Includes optional client-identifier RP-initiated provider logout after local session revocation. Includes staged native JSON and YAML sources with atomic catalog publication and retained source provenance. Other API families remain pending in this contract. Mutations require current permissions, Origin, and CSRF protection. Ordinary lifecycle changes preserve the last usable installation administrator. Filtered pages can be empty while their cursor permits another bounded scan."
"servers":
  -
    "url": "/"
"security":
  -
    "SessionCookie": []
