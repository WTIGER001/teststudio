        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/Reason"
  "/api/v1/projects/{project}/role-assignments":
    "get":
      "operationId": "listProjectAssignments"
      "summary": "Scan a bounded assignment page in this scope. Filtered pages can be empty with a continuation cursor."
      "parameters":
        -
          "$ref": "#/components/parameters/AssignmentProject"
        -
          "$ref": "#/components/parameters/Limit"
        -
          "$ref": "#/components/parameters/Cursor"
      "responses":
        "200":
          "description": "Operation completed."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/AssignmentPage"
        "401":
          "$ref": "#/components/responses/Problem"
        "403":
          "$ref": "#/components/responses/Problem"
        "404":
          "$ref": "#/components/responses/Problem"
        "409":
          "$ref": "#/components/responses/Problem"
        "422":
          "$ref": "#/components/responses/Problem"
    "post":
      "operationId": "createProjectAssignment"
      "summary": "Assign a predefined role to an existing user or group. The route determines exact bindings. A reason is required."
      "parameters":
        -
          "$ref": "#/components/parameters/AssignmentProject"
        -
          "$ref": "#/components/parameters/Origin"
      "responses":
        "200":
          "description": "Operation completed."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/AssignmentRecord"
        "401":
          "$ref": "#/components/responses/Problem"
        "403":
          "$ref": "#/components/responses/Problem"
        "404":
          "$ref": "#/components/responses/Problem"
        "409":
          "$ref": "#/components/responses/Problem"
        "422":
          "$ref": "#/components/responses/Problem"
      "security":
        -
          "SessionCookie": []
          "CSRFToken": []
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/AssignmentDefinition"
  "/api/v1/projects/{project}/role-assignments/{kind}/{principal}/{role}":
    "get":
      "operationId": "readProjectAssignment"
      "summary": "Read one exact role assignment, including legacy assignments created during bootstrap."
      "parameters":
        -
          "$ref": "#/components/parameters/AssignmentProject"
        -
          "$ref": "#/components/parameters/PrincipalKind"
        -
          "$ref": "#/components/parameters/AssignmentPrincipal"
        -
          "$ref": "#/components/parameters/AssignmentRole"
