  "/api/v1/projects/{project}/permissions/{grant}":
    "get":
      "operationId": "readProjectGrant"
      "summary": "Read one managed direct grant and current update and removal capabilities."
      "parameters":
        -
          "$ref": "#/components/parameters/AssignmentProject"
        -
          "$ref": "#/components/parameters/Grant"
      "responses":
        "200":
          "description": "Operation completed."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/GrantRecord"
        "401":
          "$ref": "#/components/responses/Problem"
        "403":
          "$ref": "#/components/responses/Problem"
        "404":
          "$ref": "#/components/responses/Problem"
        "409":
          "$ref": "#/components/responses/Problem"
        "422":
          "$ref": "#/components/responses/Problem"
    "put":
      "operationId": "updateProjectGrant"
      "summary": "Change expiry using the opened positive revision. Omitted or null expiry removes expiry. Identity stays permanent."
      "parameters":
        -
          "$ref": "#/components/parameters/AssignmentProject"
        -
          "$ref": "#/components/parameters/Grant"
        -
          "$ref": "#/components/parameters/Origin"
        -
          "$ref": "#/components/parameters/Revision"
      "responses":
