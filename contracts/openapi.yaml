        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/GrantUpdate"
    "delete":
      "operationId": "removeProjectGrant"
      "summary": "Remove this exact grant using its current revision and a reason. Preserve revision history and the last usable administrator."
      "parameters":
        -
          "$ref": "#/components/parameters/AssignmentProject"
        -
          "$ref": "#/components/parameters/Grant"
        -
