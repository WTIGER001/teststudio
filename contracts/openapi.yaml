          "type": "string"
        "provider":
          "type": "string"
        "createdAt":
          "type": "string"
          "format": "date-time"
        "lastSeen":
          "type": "string"
          "format": "date-time"
        "expiresAt":
          "type": "string"
          "format": "date-time"
        "authenticationUntil":
          "type": "string"
          "format": "date-time"
        "current":
          "type": "boolean"
      "required":
        - "id"
        - "provider"
        - "createdAt"
        - "lastSeen"
        - "expiresAt"
        - "authenticationUntil"
        - "current"
    "UserRecord":
      "type": "object"
      "properties":
        "id":
          "type": "string"
        "revision":
          "type": "integer"
          "minimum": 1
        "projectId":
          "type": "string"
        "data":
          "$ref": "#/components/schemas/User"
        "updatedAt":
          "type": "string"
          "format": "date-time"
