    "RoleRule":
      "type": "object"
      "additionalProperties": false
      "properties":
        "permission":
          "type": "string"
          "description": "Registered full teststudio permission identifier."
        "effect":
          "type": "string"
          "enum":
            - "allow"
            - "deny"
        "object":
          "type": "string"
          "description": "Optional exact relative resource, such as suite/health or test/health/check. The server loads ownership and prefixes the project. Wildcards are rejected."
        "expiresAt":
          "type":
            - "string"
            - "null"
          "format": "date-time"
          "description": "Optional expiry, normalized to UTC microseconds on both databases. Expired rules remain inspectable."
      "required":
        - "permission"
        - "effect"
    "RolePolicy":
      "type": "object"
      "additionalProperties": false
      "properties":
        "id":
          "type": "string"
          "pattern": "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"
          "description": "Permanent globally unique custom role identifier. The builtin. prefix and the custom and choices route identifiers are reserved."
        "name":
          "type": "string"
          "maxLength": 200
        "description":
          "type": "string"
          "maxLength": 4096
        "projectId":
          "type": "string"
          "description": "Permanent owning project. Empty selects installation ownership."
        "disabled":
          "type": "boolean"
          "description": "Retain the policy while withdrawing its grants and outgoing inheritance. Enabling revalidates authority."
        "rules":
          "type": "array"
          "maxItems": 100
          "items":
            "$ref": "#/components/schemas/RoleRule"
        "inherits":
          "type": "array"
          "maxItems": 16
          "items":
            "type": "string"
          "description": "Unique managed roles in the same ownership scope. Cycles and paths deeper than 16 inheritance edges are rejected."
      "required":
        - "id"
        - "name"
        - "description"
        - "projectId"
        - "disabled"
        - "rules"
        - "inherits"
