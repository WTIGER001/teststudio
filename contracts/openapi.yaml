"openapi": "3.1.0"
"info":
  "title": "TestStudio identity and access administration"
  "version": "0.2.0"
  "description": "Implemented user, group, membership, current-profile, and session administration. Includes scoped predefined role assignments. Custom policy administration and other API families remain pending in this contract. Mutations require current permissions, Origin, and CSRF protection. Ordinary lifecycle changes preserve the last usable installation administrator. Filtered pages can be empty while their cursor permits another bounded scan."
