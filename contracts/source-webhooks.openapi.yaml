openapi: 3.1.0
info:
  title: TestStudio source provider webhooks
  version: 0.2.0
paths:
  /api/v1/projects/{project}/repository-sources/{source}/webhooks/github:
    post:
      operationId: receiveGitHubSourceWebhook
      summary: Authenticate a repository event and enqueue synchronization
      description: >-
        This provider endpoint uses no browser session or CSRF token. Validate the
        HMAC-SHA256 signature over the exact request bytes before parsing JSON.
        Source settings must enable push and reference a server-side source-webhook
        secret. A prior manual sync must pin the repository identity. An accepted
        push queues resolution of the current watched reference. It starts no build
        or test within the request. Duplicate delivery identifiers return their
        original sync. Unsupported events, unwatched references, and deletions are ignored.
      security:
        - GitHubSignature: []
      parameters:
        - {name: project, in: path, required: true, schema: {type: string}}
        - {name: source, in: path, required: true, schema: {type: string}}
        - {name: X-GitHub-Delivery, in: header, required: true, schema: {type: string, maxLength: 128}}
        - {name: X-GitHub-Event, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        description: Original UTF-8 JSON bytes. The body limit is 2 MiB.
        content:
          application/json:
            schema:
              type: object
              required: [repository]
              properties:
                repository:
                  type: object
                  required: [id, full_name]
                  properties:
                    id: {type: integer, minimum: 1}
                    full_name: {type: string}
                  additionalProperties: true
                ref: {type: string}
                after: {type: string}
                deleted: {type: boolean}
              additionalProperties: true
      responses:
        '202':
          description: Queued or authenticated and ignored
          content:
            application/json:
              schema:
                type: object
                required: [state]
                properties:
                  state: {type: string, enum: [queued, ignored]}
                  syncId: {type: string}
        '403': {description: Signature, source identity, settings, or current authority reject the delivery}
        '413': {description: The original request body exceeds 2 MiB}
  /api/v1/projects/{project}/repository-sources/{source}/webhooks/{provider}:
    post:
      operationId: receiveGitLabSourceWebhook
      summary: Authenticate a push event from an approved self-managed GitLab server
      description: >-
        Provider must match the configured server key. Compare X-Gitlab-Token
        with the separate source-webhook secret in constant time before parsing.
        HTTPS, a pinned repository identity, current authority, and enabled push
        settings are required. Delivery UUID and body digest prevent replay with
        a changed payload. Watched branch or tag pushes queue ordinary source
        synchronization. Deletions and unsupported events start no work.
      security:
        - GitLabToken: []
      parameters:
        - {name: project, in: path, required: true, schema: {type: string}}
        - {name: source, in: path, required: true, schema: {type: string}}
        - {name: provider, in: path, required: true, schema: {type: string}}
        - {name: X-Gitlab-Event-UUID, in: header, required: true, schema: {type: string, maxLength: 128}}
        - {name: X-Gitlab-Event, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: true}
      responses:
        '202': {description: Authenticated and queued or ignored; synchronization never starts tests}
        '403': {description: Authentication, identity, settings, or authority rejected}
        '413': {description: Original request body exceeds 2 MiB}
components:
  securitySchemes:
    GitLabToken:
      type: apiKey
      in: header
      name: X-Gitlab-Token
      description: Separate server-side source-webhook secret; HTTPS is required.
    GitHubSignature:
      type: apiKey
      in: header
      name: X-Hub-Signature-256
      description: sha256= followed by the hexadecimal HMAC-SHA256 of the original body
